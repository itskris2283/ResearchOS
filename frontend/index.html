<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ResearchOS — The AI Operating System for Scientific Discovery</title>
    <meta name="description" content="ResearchOS automatically discovers papers, finds authors, datasets, benchmarks, GitHub implementations, builds citation graphs, knowledge graphs, and generates literature reviews from any research topic." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      .app-loading { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: #0a0a0f; font-family: 'Inter', system-ui, sans-serif; }
      .app-loading-inner { text-align: center; }
      .app-loading-spinner { width: 40px; height: 40px; margin: 0 auto 20px; border: 3px solid rgba(255,255,255,0.08); border-top-color: #6366f1; border-radius: 50%; animation: spin 0.8s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      .app-loading-text { color: rgba(255,255,255,0.4); font-size: 14px; font-weight: 500; letter-spacing: 0.3px; }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="app-loading">
        <div class="app-loading-inner">
          <div class="app-loading-spinner"></div>
          <div class="app-loading-text">ResearchOS</div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
