<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ResearchOS — The Working Paper Machine</title>
    <script>
      (function () {
        try {
          var t = localStorage.getItem("researchos-theme");
          if (!t) t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          var root = document.documentElement;
          root.classList.add(t);
          root.style.colorScheme = t;
        } catch (e) {}
      })();
    </script>
    <meta name="description" content="ResearchOS automatically discovers papers, finds authors, datasets, benchmarks, GitHub implementations, builds citation graphs, knowledge graphs, and generates literature reviews from any research topic." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=STIX+Two+Text:ital,wght@0,400..700;1,400..700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      .app-loading {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background: #fbfbf5;
        font-family: "IBM Plex Mono", monospace;
      }
      .app-loading-inner { text-align: center; }
      .app-loading-spinner {
        width: 28px;
        height: 28px;
        margin: 0 auto 16px;
        border: 2px solid rgba(28, 36, 51, 0.12);
        border-top-color: #b01e28;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      html.dark .app-loading {
        background: #11151b;
      }
      html.dark .app-loading-spinner {
        border-color: rgba(226, 232, 240, 0.15);
        border-top-color: #d33842;
      }
      html.dark .app-loading-text {
        color: #9aa3b1;
      }
      .app-loading-text {
        color: #66707f;
        font-size: 11px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="app-loading">
        <div class="app-loading-inner">
          <div class="app-loading-spinner"></div>
          <div class="app-loading-text">ResearchOS</div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
